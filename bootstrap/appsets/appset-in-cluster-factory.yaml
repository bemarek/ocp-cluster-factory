apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: in-cluster-factory
  namespace: openshift-gitops
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true

  # ---------------------------------------------------------------------------
  # PROGRESSIVE SYNCS: Orchestrating the order of applications deployment.
  # Argo CD executes these steps strictly from top to bottom.
  # It waits for ALL apps in a step to become 'Healthy' before moving to the next.
  # ---------------------------------------------------------------------------
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["110"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["120"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["211"]
        
        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["410"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["510"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["611"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["612"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["711"]

        - matchExpressions:
            - key: factory.stage
              operator: In
              values: ["712"]

        - matchExpressions:
            - key: factory.stage
              operator: NotIn
              values: [""]

  generators:
    - git:
        repoURL: https://github.com/bemarek/ocp-cluster-factory.git
        revision: HEAD
        files:
          - path: 'overlays/in-cluster/**/kustomization.yaml'
  
  template:
    metadata:
      # Dynamic naming skipping the first root segment (e.g., 'in-cluster-200-security-...')
      name: '{{ slice .path.segments 1 | join "-" }}'
      
      labels:
        app.kubernetes.io/managed-by: 'in-cluster-factory'
        
# DYNAMIC STAGE EXTRACTION:
        # $l = last segment (target directory)
        # $p = second-to-last segment (parent directory)
        # If $l starts with digits -> use them. Otherwise, fallback to digits from $p.
        factory.stage: '{{- $l := index .path.segments (sub (len .path.segments) 1) -}}{{- $p := index .path.segments (sub (len .path.segments) 2) -}}{{- $wl := $l | regexFind "^[0-9]+" -}}{{- $wp := $p | regexFind "^[0-9]+" -}}{{- $w := ternary $wl $wp (ne $wl "") -}}{{- $w | default "none" -}}'

    spec:
      project: default
      source:
        repoURL: https://github.com/bemarek/ocp-cluster-factory.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: false # Safety: prevents automatic deletion of cluster resources on Git updates
          selfHeal: true
