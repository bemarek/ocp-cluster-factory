apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# ---------------------------------------------------------------------------
# Enables Progressive Syncs (--enable-progressive-syncs) on the ApplicationSet
# controller within the default OpenShift GitOps instance.
# ---------------------------------------------------------------------------
patches:
  - target:
      kind: ArgoCD
      name: openshift-gitops
      namespace: openshift-gitops
    patch: |
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: openshift-gitops
        namespace: openshift-gitops
      spec:
        applicationSet:
          extraCommandArgs:
            - "--enable-progressive-syncs"