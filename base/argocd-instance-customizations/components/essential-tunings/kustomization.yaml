apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# ---------------------------------------------------------------------------
# Base configuration patch for OpenShift GitOps ArgoCD instance:
# - Enables ApplicationSet controller
# - Enables Helm integration for Kustomize builds (--enable-helm)
# - Disables legacy built-in Grafana
# - Excludes Kubernetes events.k8s.io/Event resources
# ---------------------------------------------------------------------------
patches:
  - target:
      kind: ArgoCD
      name: openshift-gitops
      namespace: openshift-gitops
    patch: |-
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: openshift-gitops
        namespace: openshift-gitops
      spec:
        applicationSet:
          enabled: true
        kustomizeBuildOptions: "--enable-helm"
        grafana:
          enabled: false
        resourceExclusions: |
          - apiGroups:
            - events.k8s.io
            kinds:
            - Event